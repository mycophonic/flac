# The harness module's carve-outs from the Go lint baseline
# (.limen/lint-go.yaml), in .lint-go.yaml's shape: the root module's overlay
# does not reach a nested module, so this one is the harness's own, rendered
# on the same baseline by `limen-lint-go -C harness` (the root .justfile's
# lint-harness).

licenses:
  # The baseline's list, restated since `allowed` replaces it, plus the
  # Unlicense: upstream mewkiz/flac and its mewkiz helpers carry it, and so
  # does this repository's own module, which the harness imports. The
  # harness exists to compare the two, so neither dependency can go.
  allowed:
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - MIT
    - Unlicense

golangci:
  linters:
    exclusions:
      rules:
        # go.mod's local replace is the design, not a shortcut: the harness is
        # a main package nobody imports, and the fork it tests is the checkout
        # it lives in, which the replace names; the require line is nominal.
        # A pinned require had Renovate bumping this repository's own digest
        # after every merge, each bump a merge that opened the next.
        - path: ^go\.mod$
          linters:
            - gomoddirectives
        # ---------------------------------------------------------------------------
        # ONBOARDING BACKLOG. Not a judgment: these are the findings the baseline
        # raised on code that predates the harness's lint lanes, exempted so
        # they land green (book/mandatory-files.md, "Onboarding an existing
        # repository"), as the root .lint-go.yaml does for the library. Nobody
        # has read them yet. Alignment empties this block one linter or one
        # file per pull request, each finding fixed, silenced inline with its
        # reason, or raised as a rule; the last alignment pull request deletes
        # the block.
        # Counts are the measurement when the harness came under the lanes, after
        # the mechanical fixers ran, per file and linter: 846 in 13 files.
        # ---------------------------------------------------------------------------
        - path: ^alloc\.go$
          linters: # 61 findings
            - mnd # 16
            - varnamelen # 14
            - wrapcheck # 6
            - depguard # 4
            - goconst # 4
            - gosec # 4
